# Brief 5 (2026-09-05): self-hosted, aggregate-only analytics. Umami over
# Plausible — simpler single-container self-host, official Postgres image,
# no separate ClickHouse to run on a box already sharing its one GPU with
# an LLM. Bound to 127.0.0.1 only (both umami and its db) — reachable
# from this box only, exposed publicly at stats.antara.money purely
# through the existing Cloudflare tunnel, same posture as
# antara-frontend.service (3001) and antara-ml.service (8001) already
# have. No third-party ad-tech SDK, no cross-site cookies, no per-user
# behavioural profile — this is deliberate for an app used by minors, not
# a preference (see REVIEW.md).
services:
  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - umami-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - umami-internal

volumes:
  umami-db-data:

networks:
  umami-internal:
    driver: bridge
