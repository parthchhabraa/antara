<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="900" height="480" fill="#0A0C10"/>
  <text x="30" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#F3F1F8">Median monthly spend by category</text>
  <text x="30" y="58" font-family="Arial, sans-serif" font-size="12.5" fill="#9AA0A6">Real survey data · n=36 · all categories shown are "confident" tier (≥20 responses)</text>

  <!-- rows: label, value, width(px out of 560 max at 2000) -->
  <g font-family="Arial, sans-serif" font-size="13">
    <!-- Food & Snacks 2000 -->
    <text x="30" y="100" fill="#E5E7EB">Food &amp; Snacks</text>
    <rect x="230" y="86" width="560" height="20" rx="4" fill="url(#bar)"/>
    <text x="800" y="100" fill="#F3F1F8" font-weight="600">₹2,000</text>

    <!-- Dates & Outings 1000 -->
    <text x="30" y="138" fill="#E5E7EB">Dates &amp; Outings</text>
    <rect x="230" y="124" width="280" height="20" rx="4" fill="url(#bar)"/>
    <text x="520" y="138" fill="#F3F1F8" font-weight="600">₹1,000</text>

    <!-- Clothes & Shoes 1000 -->
    <text x="30" y="176" fill="#E5E7EB">Clothes &amp; Shoes</text>
    <rect x="230" y="162" width="280" height="20" rx="4" fill="url(#bar)"/>
    <text x="520" y="176" fill="#F3F1F8" font-weight="600">₹1,000</text>

    <!-- Transportation 500 -->
    <text x="30" y="214" fill="#E5E7EB">Transportation</text>
    <rect x="230" y="200" width="140" height="20" rx="4" fill="url(#bar)"/>
    <text x="380" y="214" fill="#F3F1F8" font-weight="600">₹500</text>

    <!-- Grooming 500 -->
    <text x="30" y="252" fill="#E5E7EB">Grooming</text>
    <rect x="230" y="238" width="140" height="20" rx="4" fill="url(#bar)"/>
    <text x="380" y="252" fill="#F3F1F8" font-weight="600">₹500</text>

    <!-- Subscriptions 200 -->
    <text x="30" y="290" fill="#E5E7EB">Subscriptions</text>
    <rect x="230" y="276" width="56" height="20" rx="4" fill="url(#bar)"/>
    <text x="296" y="290" fill="#F3F1F8" font-weight="600">₹200</text>

    <!-- Movies & Entertainment 150 -->
    <text x="30" y="328" fill="#E5E7EB">Movies &amp; Entertainment</text>
    <rect x="230" y="314" width="42" height="20" rx="4" fill="url(#bar)"/>
    <text x="282" y="328" fill="#F3F1F8" font-weight="600">₹150</text>

    <!-- Gifting Friends 100 -->
    <text x="30" y="366" fill="#E5E7EB">Money Given to Friends</text>
