    <text x="268" y="404" fill="#F3F1F8" font-weight="600">₹100</text>

    <!-- Books 100 -->
    <text x="30" y="442" fill="#E5E7EB">Books</text>
    <rect x="230" y="428" width="28" height="20" rx="4" fill="url(#bar)"/>
    <text x="268" y="442" fill="#F3F1F8" font-weight="600">₹100</text>

    <!-- Mobile Recharge 50 -->
    <text x="30" y="466" fill="#E5E7EB" font-size="12">Mobile Recharge/Data</text>
